name: CI

on:
  push:
    branches: [main, master, "faz-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build ve testler gerçek Supabase'e bağlanmaz; yer tutucu değerler yeterli.
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  # STUDENT_EMAIL_DOMAIN verilmez: iş düzeyi env .env.local'ı ezer; koddaki varsayılan seed ile aynı.

jobs:
  check:
    name: Lint · typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm build

  e2e:
    name: Playwright (yerel Supabase + seed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      # Auth, REST, Mailpit ve seed gerekir; ağır servisler kapalı.
      - name: Yerel Supabase'i başlat (migration + seed)
        run: supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor,realtime,storage-api,postgres-meta
      # .env.local runner'da supabase status çıktısından üretilir; gizli değer depoda yok.
      - name: Ortam değişkenlerini üret
        run: node scripts/write-local-env.mjs --force
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: always()
        run: supabase stop --no-backup
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db:
    name: Supabase migrations · pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Migration'ları sıfırdan uygula
        run: supabase db start
      - name: RLS testleri (pgTAP)
        run: supabase test db
